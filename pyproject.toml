[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "four-color-proof-program"
version = "0.1.0"
description = "Exact Penrose/Tait fixtures and a knot-theoretic Four Color proof-search program"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
experiments = ["networkx>=3.2"]

[tool.setuptools]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
